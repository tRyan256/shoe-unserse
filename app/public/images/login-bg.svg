<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419"/>
      <stop offset="50%" style="stop-color:#1a2634"/>
      <stop offset="100%" style="stop-color:#0d1821"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="shoeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="375" height="812" fill="url(#bgGradient)"/>
  
  <g opacity="0.4">
    <circle cx="320" cy="120" r="150" fill="url(#glowGradient)" filter="url(#softGlow)"/>
    <circle cx="50" cy="700" r="120" fill="url(#glowGradient)" filter="url(#softGlow)"/>
  </g>
  
  <g stroke="rgba(20,184,166,0.1)" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="100" x2="375" y2="100"/>
    <line x1="0" y1="200" x2="375" y2="200"/>
    <line x1="0" y1="300" x2="375" y2="300"/>
    <line x1="0" y1="400" x2="375" y2="400"/>
    <line x1="0" y1="500" x2="375" y2="500"/>
    <line x1="0" y1="600" x2="375" y2="600"/>
    <line x1="0" y1="700" x2="375" y2="700"/>
    <line x1="75" y1="0" x2="75" y2="812"/>
    <line x1="150" y1="0" x2="150" y2="812"/>
    <line x1="225" y1="0" x2="225" y2="812"/>
    <line x1="300" y1="0" x2="300" y2="812"/>
  </g>
  
  <g transform="skewY(-8)">
    <rect x="-50" y="180" width="480" height="2" fill="url(#accentGradient)"/>
    <rect x="-50" y="220" width="480" height="1" fill="url(#accentGradient)" opacity="0.5"/>
    <rect x="-50" y="620" width="480" height="2" fill="url(#accentGradient)"/>
    <rect x="-50" y="660" width="480" height="1" fill="url(#accentGradient)" opacity="0.5"/>
  </g>
  
  <g opacity="0.15">
    <circle cx="30" cy="150" r="2" fill="#14b8a6"/>
    <circle cx="100" cy="80" r="1.5" fill="#14b8a6"/>
    <circle cx="180" cy="130" r="1" fill="#14b8a6"/>
    <circle cx="280" cy="90" r="2" fill="#14b8a6"/>
    <circle cx="340" cy="160" r="1.5" fill="#14b8a6"/>
    <circle cx="60" cy="750" r="2" fill="#14b8a6"/>
    <circle cx="150" cy="780" r="1.5" fill="#14b8a6"/>
    <circle cx="300" cy="760" r="2" fill="#14b8a6"/>
    <circle cx="350" cy="720" r="1" fill="#14b8a6"/>
  </g>
  
  <g transform="translate(280, 580)" opacity="0.08">
    <path d="M0 40 Q10 35 20 40 L60 30 Q80 25 100 35 L120 40 Q110 50 90 48 L30 55 Q10 55 0 40" 
          fill="url(#shoeGradient)"/>
    <ellipse cx="30" cy="52" rx="15" ry="5" fill="url(#shoeGradient)" opacity="0.5"/>
    <ellipse cx="90" cy="50" rx="12" ry="4" fill="url(#shoeGradient)" opacity="0.5"/>
  </g>
  
  <g transform="translate(20, 250)" opacity="0.06">
    <path d="M0 30 Q8 26 16 30 L48 24 Q64 20 80 28 L96 32 Q88 40 72 38 L24 44 Q8 44 0 30" 
          fill="url(#shoeGradient)"/>
    <ellipse cx="24" cy="42" rx="12" ry="4" fill="url(#shoeGradient)" opacity="0.5"/>
    <ellipse cx="72" cy="40" rx="10" ry="3" fill="url(#shoeGradient)" opacity="0.5"/>
  </g>
  
  <polygon points="30,50 50,30 70,50 50,70" fill="none" stroke="rgba(20,184,166,0.3)" stroke-width="1"/>
  <polygon points="320,750 340,730 360,750 340,770" fill="none" stroke="rgba(20,184,166,0.2)" stroke-width="1"/>
  
  <polyline points="20,100 20,80 40,80" fill="none" stroke="rgba(20,184,166,0.4)" stroke-width="1.5"/>
  <polyline points="335,720 355,720 355,740" fill="none" stroke="rgba(20,184,166,0.3)" stroke-width="1.5"/>
  
  <circle cx="187" cy="406" r="200" fill="none" stroke="rgba(20,184,166,0.05)" stroke-width="1"/>
  <circle cx="187" cy="406" r="280" fill="none" stroke="rgba(20,184,166,0.03)" stroke-width="1"/>
  
  <path d="M0 812 Q 94 780 188 800 T 375 770 L 375 812 L 0 812 Z" fill="rgba(20,184,166,0.03)"/>
</svg>
