<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1200px; 
      height: 400px; 
      overflow: hidden;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      position: relative;
    }
    
    /* 动态几何线条 */
    .line {
      position: absolute;
      background: linear-gradient(90deg, transparent, rgba(233, 69, 96, 0.3), transparent);
      transform-origin: left center;
    }
    
    .line-1 {
      width: 600px;
      height: 2px;
      top: 80px;
      left: -100px;
      transform: rotate(-15deg);
    }
    
    .line-2 {
      width: 800px;
      height: 1px;
      top: 200px;
      right: -200px;
      transform: rotate(25deg);
      background: linear-gradient(90deg, transparent, rgba(79, 172, 254, 0.4), transparent);
    }
    
    .line-3 {
      width: 500px;
      height: 3px;
      bottom: 120px;
      left: 100px;
      transform: rotate(-8deg);
      background: linear-gradient(90deg, transparent, rgba(233, 69, 96, 0.5), transparent);
    }
    
    /* 抽象几何形状 */
    .shape {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .shape-1 {
      width: 200px;
      height: 200px;
      top: 50px;
      right: 150px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, rgba(233, 69, 96, 0.1), transparent);
    }
    
    .shape-2 {
      width: 150px;
      height: 150px;
      bottom: 80px;
      left: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 172, 254, 0.15), transparent);
    }
    
    .shape-3 {
      width: 100px;
      height: 100px;
      top: 100px;
      left: 100px;
      transform: skew(-20deg);
      background: linear-gradient(45deg, rgba(255, 255, 255, 0.05), transparent);
    }
    
    /* 网格纹理 */
    .grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    
    /* 光晕效果 */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }
    
    .glow-1 {
      width: 400px;
      height: 400px;
      top: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(233, 69, 96, 0.2), transparent);
    }
    
    .glow-2 {
      width: 300px;
      height: 300px;
      bottom: -50px;
      left: -50px;
      background: radial-gradient(circle, rgba(79, 172, 254, 0.15), transparent);
    }
    
    /* 点阵装饰 */
    .dots {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.5;
    }
    
    /* 文字区域 */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }
    
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 20px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 2px;
    }
    
    /* 装饰性元素 */
    .accent {
      position: absolute;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #e94560, #4facfe);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin-top: 60px;
    }
    
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(233, 69, 96, 0.3);
    }
    
    .corner-tl { top: 40px; left: 40px; border-right: none; border-bottom: none; }
    .corner-tr { top: 40px; right: 40px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 40px; left: 40px; border-right: none; border-top: none; }
    .corner-br { bottom: 40px; right: 40px; border-left: none; border-top: none; }
  </style>
</head>
<body>
  <!-- 背景层 -->
  <div class="grid"></div>
  <div class="dots"></div>
  
  <!-- 光晕 -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  
  <!-- 几何线条 -->
  <div class="line line-1"></div>
  <div class="line line-2"></div>
  <div class="line line-3"></div>
  
  <!-- 几何形状 -->
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
  
  <!-- 角落装饰 -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  
  <!-- 内容 -->
  <div class="content">
    <h1 class="title">Shoe Universe</h1>
    <p class="subtitle">探索限量球鞋世界，发现专属你的潮流单品</p>
    <div class="accent"></div>
  </div>
</body>
</html>
