<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="lineGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#e94560;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="lineGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <!-- 深色背景 -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- 网格纹理 -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="650" y1="0" x2="650" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="850" y1="0" x2="850" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="950" y1="0" x2="950" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="1150" y1="0" x2="1150" y2="400"/>
  </g>
  
  <!-- 几何线条 -->
  <line x1="-100" y1="80" x2="500" y2="-80" stroke="url(#lineGradient1)" stroke-width="2" transform="rotate(-15, -100, 80)"/>
  <line x1="400" y1="200" x2="1200" y2="500" stroke="url(#lineGradient2)" stroke-width="1" transform="rotate(25, 400, 200)"/>
  <line x1="100" y1="280" x2="600" y2="200" stroke="url(#lineGradient1)" stroke-width="3" transform="rotate(-8, 100, 280)"/>
  
  <!-- 菱形装饰 -->
  <polygon points="1050,50 1150,150 1050,250 950,150" fill="rgba(233,69,96,0.08)" stroke="rgba(233,69,96,0.2)" stroke-width="1"/>
  
  <!-- 圆形装饰 -->
  <circle cx="275" cy="245" r="75" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- 平行四边形装饰 -->
  <polygon points="150,150 250,150 214,250 114,250" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- 角落装饰 -->
  <polyline points="40,60 40,40 60,40" fill="none" stroke="rgba(233,69,96,0.4)" stroke-width="2"/>
  <polyline points="1140,40 1160,40 1160,60" fill="none" stroke="rgba(233,69,96,0.4)" stroke-width="2"/>
  <polyline points="40,340 40,360 60,360" fill="none" stroke="rgba(233,69,96,0.4)" stroke-width="2"/>
  <polyline points="1140,360 1160,360 1160,340" fill="none" stroke="rgba(233,69,96,0.4)" stroke-width="2"/>
  
  <!-- Logo区域 -->
  <image href="/logo.png" x="520" y="80" width="160" height="160" opacity="0.9"/>
  
  <!-- 文字 -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="3">Shoe Universe</text>
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="2">探索限量球鞋世界，发现专属你的潮流单品</text>
  
  <!-- 装饰线 -->
  <rect x="570" y="345" width="60" height="3" fill="url(#accentGradient)" rx="1.5"/>
</svg>