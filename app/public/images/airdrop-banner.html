<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 400px;
      background: linear-gradient(165deg, #F5A962 0%, #E8954E 30%, #D48545 60%, #8B6B4A 100%);
      position: relative;
      overflow: hidden;
    }
    /* 微妙的光晕效果 */
    .glow {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(255, 200, 120, 0.2) 0%, transparent 70%);
      top: -200px;
      right: -100px;
      pointer-events: none;
    }
    /* 细微噪点纹理 */
    .noise {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="noise"></div>
</body>
</html>
