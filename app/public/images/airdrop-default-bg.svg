<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- 深邃宇宙渐变 -->
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>

    <!-- 金色光芒渐变 -->
    <radialGradient id="goldenGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ffaa00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>

    <!-- 礼物盒金色渐变 -->
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>

    <!-- 丝带渐变 -->
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ee5a5a"/>
      <stop offset="100%" stop-color="#d63031"/>
    </linearGradient>

    <!-- 星星发光滤镜 -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 宇宙背景 -->
  <rect width="1200" height="400" fill="url(#spaceGradient)"/>

  <!-- 顶部金色光芒 -->
  <rect width="1200" height="400" fill="url(#goldenGlow)"/>

  <!-- 星星背景 -->
  <g fill="#fff" opacity="0.8">
    <circle cx="100" cy="50" r="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="80" r="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="40" r="2" opacity="0.7" filter="url(#starGlow)"/>
    <circle cx="550" cy="100" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="850" cy="90" r="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="45" r="1.8" opacity="0.7" filter="url(#starGlow)"/>
    <circle cx="1150" cy="70" r="1.3" opacity="0.5"/>
    <circle cx="150" cy="150" r="1" opacity="0.3"/>
    <circle cx="350" cy="180" r="1.5" opacity="0.4"/>
    <circle cx="600" cy="160" r="1.2" opacity="0.35"/>
    <circle cx="900" cy="170" r="1" opacity="0.3"/>
    <circle cx="1100" cy="140" r="1.4" opacity="0.45"/>
  </g>

  <!-- 流星效果 -->
  <g opacity="0.6">
    <line x1="200" y1="20" x2="250" y2="60" stroke="url(#boxGradient)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="200;180;200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="250;230;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="20;40;20" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="60;80;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="800" y1="30" x2="860" y2="80" stroke="url(#boxGradient)" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="800;780;800" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="x2" values="860;840;860" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="y1" values="30;50;30" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="y2" values="80;100;80" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="1s"/>
    </line>
  </g>

  <!-- 飘落的礼物盒 -->
  <g opacity="0.9">
    <!-- 礼物盒1 -->
    <g transform="translate(150, 120)">
      <animateTransform attributeName="transform" type="translate" values="150,120;150,140;150,120" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="-5 30 30;5 30 30;-5 30 30" dur="3s" repeatCount="indefinite" additive="sum"/>
      <!-- 盒子 -->
      <rect x="10" y="15" width="40" height="35" rx="3" fill="url(#boxGradient)"/>
      <!-- 垂直丝带 -->
      <rect x="28" y="15" width="4" height="35" fill="url(#ribbonGradient)"/>
      <!-- 水平丝带 -->
      <rect x="10" y="28" width="40" height="4" fill="url(#ribbonGradient)"/>
      <!-- 蝴蝶结 -->
      <ellipse cx="30" cy="12" rx="8" ry="5" fill="url(#ribbonGradient)"/>
      <ellipse cx="25" cy="10" rx="6" ry="4" fill="#ff5252"/>
      <ellipse cx="35" cy="10" rx="6" ry="4" fill="#ff5252"/>
    </g>

    <!-- 礼物盒2 -->
    <g transform="translate(450, 80) scale(0.8)">
      <animateTransform attributeName="transform" type="translate" values="450,80;450,110;450,80" dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="5 30 30;-5 30 30;5 30 30" dur="3.5s" repeatCount="indefinite" additive="sum"/>
      <rect x="10" y="15" width="40" height="35" rx="3" fill="url(#boxGradient)"/>
      <rect x="28" y="15" width="4" height="35" fill="url(#ribbonGradient)"/>
      <rect x="10" y="28" width="40" height="4" fill="url(#ribbonGradient)"/>
      <ellipse cx="30" cy="12" rx="8" ry="5" fill="url(#ribbonGradient)"/>
      <ellipse cx="25" cy="10" rx="6" ry="4" fill="#ff5252"/>
      <ellipse cx="35" cy="10" rx="6" ry="4" fill="#ff5252"/>
    </g>

    <!-- 礼物盒3 -->
    <g transform="translate(750, 100) scale(0.6)">
      <animateTransform attributeName="transform" type="translate" values="750,100;750,130;750,100" dur="4.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="-8 30 30;8 30 30;-8 30 30" dur="4s" repeatCount="indefinite" additive="sum"/>
      <rect x="10" y="15" width="40" height="35" rx="3" fill="url(#boxGradient)"/>
      <rect x="28" y="15" width="4" height="35" fill="url(#ribbonGradient)"/>
      <rect x="10" y="28" width="40" height="4" fill="url(#ribbonGradient)"/>
      <ellipse cx="30" cy="12" rx="8" ry="5" fill="url(#ribbonGradient)"/>
      <ellipse cx="25" cy="10" rx="6" ry="4" fill="#ff5252"/>
      <ellipse cx="35" cy="10" rx="6" ry="4" fill="#ff5252"/>
    </g>

    <!-- 礼物盒4 -->
    <g transform="translate(1000, 60) scale(0.7)">
      <animateTransform attributeName="transform" type="translate" values="1000,60;1000,90;1000,60" dur="5.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="3 30 30;-3 30 30;3 30 30" dur="3s" repeatCount="indefinite" additive="sum"/>
      <rect x="10" y="15" width="40" height="35" rx="3" fill="url(#boxGradient)"/>
      <rect x="28" y="15" width="4" height="35" fill="url(#ribbonGradient)"/>
      <rect x="10" y="28" width="40" height="4" fill="url(#ribbonGradient)"/>
      <ellipse cx="30" cy="12" rx="8" ry="5" fill="url(#ribbonGradient)"/>
      <ellipse cx="25" cy="10" rx="6" ry="4" fill="#ff5252"/>
      <ellipse cx="35" cy="10" rx="6" ry="4" fill="#ff5252"/>
    </g>
  </g>

  <!-- 金币/代币元素 -->
  <g opacity="0.7">
    <circle cx="300" cy="200" r="12" fill="#ffd700" stroke="#ffaa00" stroke-width="2">
      <animate attributeName="cy" values="200;220;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="300" y="205" text-anchor="middle" font-size="10" fill="#b8860b" font-weight="bold">¥</text>

    <circle cx="600" cy="180" r="10" fill="#ffd700" stroke="#ffaa00" stroke-width="2">
      <animate attributeName="cy" values="180;200;180" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text x="600" y="184" text-anchor="middle" font-size="8" fill="#b8860b" font-weight="bold">¥</text>

    <circle cx="900" cy="210" r="11" fill="#ffd700" stroke="#ffaa00" stroke-width="2">
      <animate attributeName="cy" values="210;230;210" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <text x="900" y="215" text-anchor="middle" font-size="9" fill="#b8860b" font-weight="bold">¥</text>
  </g>

  <!-- 底部光晕装饰 -->
  <ellipse cx="600" cy="450" rx="500" ry="200" fill="url(#goldenGlow)" opacity="0.3"/>
</svg>
