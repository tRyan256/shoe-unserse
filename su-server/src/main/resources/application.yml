server:
  port: 8080
  tomcat:
    threads:
      max: ${SU_TOMCAT_MAX_THREADS:400}
      min-spare: ${SU_TOMCAT_MIN_SPARE:32}
    accept-count: ${SU_TOMCAT_ACCEPT_COUNT:1000}
    max-connections: ${SU_TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${SU_TOMCAT_CONNECTION_TIMEOUT:5000ms}
    keep-alive-timeout: ${SU_TOMCAT_KEEPALIVE_TIMEOUT:20000ms}

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${su.datasource.driver-class-name}
    url: jdbc:mysql://${su.datasource.host}:${su.datasource.port}/${su.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${su.datasource.username}
    password: ${su.datasource.password}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: ${SU_HIKARI_MAX_POOL_SIZE:80}
      minimum-idle: ${SU_HIKARI_MIN_IDLE:20}
  data:
    redis:
      host: ${su.redis.host}
      port: ${su.redis.port}
      password: ${su.redis.password}
      database: ${su.redis.database}
      lettuce:
        pool:
          max-active: ${SU_REDIS_POOL_MAX_ACTIVE:128}
          max-idle: ${SU_REDIS_POOL_MAX_IDLE:32}
          min-idle: ${SU_REDIS_POOL_MIN_IDLE:16}
          max-wait: ${SU_REDIS_POOL_MAX_WAIT:1000ms}
        shutdown-timeout: 100ms
  rabbitmq:
    host: ${sq.mq.host:192.168.150.101}
    port: ${sq.mq.port:5672}
    virtual-host: ${sq.mq.vhost:/su}
    username: ${sq.mq.username:shoe}
    password: ${sq.mq.password:123456}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: ${SU_RABBIT_CONCURRENCY:8}
        max-concurrency: ${SU_RABBIT_MAX_CONCURRENCY:32}
        prefetch: ${SU_RABBIT_PREFETCH:100}
        retry:
          enabled: ${sq.mq.listener.retry.enable:true}
          initial-interval: ${sq.mq.listener.retry.interval:1000ms}
          multiplier: ${sq.mq.listener.retry.multiplier:2}
          max-attempts: ${sq.mq.listener.retry.max-attempts:3}
          stateless: ${sq.mq.listener.retry.stateless:true}
  task:
    scheduling:
      pool:
        size: ${SU_SCHEDULING_POOL_SIZE:8}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.su.entity
  type-handlers-package: com.su.handler
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      su:
        mapper: debug
        service: info
        controller: info

su:
  jwt:
    admin-secret-key: itcast
    admin-ttl: 2592000000
    admin-token-name: token
    user-secret-key: suwechat
    user-ttl: 2592000000
    user-token-name: Authorization

  alioss:
    access-key-id: ${su.alioss.access-key-id}
    access-key-secret: ${su.alioss.access-key-secret}
    bucket-name: ${su.alioss.bucket-name}
    endpoint: ${su.alioss.endpoint}

  wechat:
    appid: ${su.wechat.appid}
    secret: ${su.wechat.secret}

knife4j:
  enable: true
  production: false
  basic:
    enable: false
  setting:
    language: zh_cn
  cors: false
